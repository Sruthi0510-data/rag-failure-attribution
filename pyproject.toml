[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-failure-attribution"
version = "0.1.0"
description = "Attributes RAG retrieval failures to their actual cause, separating the ones a better retriever can fix from the ones only re-chunking can."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Laxmi Sruthi Susarla" }]
dependencies = []

[project.optional-dependencies]
transformers = ["sentence-transformers>=2.2", "torch>=2.0"]
vector = ["chromadb>=0.4"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4",

  # The suite and the artefact build need these, so `dev` installs them.
  # An optional module that continuous integration never installs is a
  # module continuous integration never covers, and the coverage floor
  # then passes by not looking.
  "coverage>=7",
  "playwright>=1.40",
  "cmarkgfm>=2024.1.14",
]

[project.scripts]
rfa = "rfa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["rfa"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools", "experiments"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RET", "ARG", "PTH"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["rfa", "tests"]
known-local-folder = ["_common"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]
