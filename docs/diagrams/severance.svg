<svg xmlns="http://www.w3.org/2000/svg" width="664" height="342" viewBox="0 0 664 342" role="img"><rect x="0" y="0" width="664" height="342" fill="#f9f9f7"/><text x="24" y="34" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#0b0b0b" font-weight="bold" text-anchor="start">How an answer stops being an answer</text><text x="24" y="56" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start">answers average 209.9 characters long; chunks are 320</text><rect x="24" y="86" width="616" height="46" rx="4" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/><line x1="178" y1="78" x2="178" y2="140" stroke="#0b0b0b" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="332" y1="78" x2="332" y2="140" stroke="#0b0b0b" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="486" y1="78" x2="486" y2="140" stroke="#0b0b0b" stroke-width="1.5" stroke-dasharray="4 3"/><text x="30" y="72" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#898781" font-weight="normal" text-anchor="start">one document, cut every 320 characters</text><rect x="232" y="98" width="208" height="22" rx="3" fill="#eb6834" fill-opacity="0.22" stroke="#eb6834" stroke-width="1.5"/><text x="239.9" y="113" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#0b0b0b" font-weight="bold" text-anchor="start">the annotated answer</text><text x="24" y="166" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#0b0b0b" font-weight="bold" text-anchor="start">the boundary falls inside the answer, so no chunk holds all of it</text><rect x="24" y="190" width="616" height="24" rx="3" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/><text x="38" y="206" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#0b0b0b" font-weight="bold" text-anchor="start">chunk 2</text><text x="150" y="206" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start">holds the first half</text><text x="400" y="206" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#898781" font-weight="normal" text-anchor="start">overlaps the answer</text><rect x="24" y="220" width="616" height="24" rx="3" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/><text x="38" y="236" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#0b0b0b" font-weight="bold" text-anchor="start">chunk 3</text><text x="150" y="236" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start">holds the second half</text><text x="400" y="236" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#898781" font-weight="normal" text-anchor="start">overlaps the answer</text><rect x="24" y="250" width="616" height="24" rx="3" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/><text x="38" y="266" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#0b0b0b" font-weight="bold" text-anchor="start">either chunk</text><text x="150" y="266" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start">answers the question</text><text x="400" y="266" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#eb6834" font-weight="bold" text-anchor="start">no</text><text x="24" y="300" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start">recall@k sees a retrieved chunk touching the annotated span and records a hit. On this corpus that</text><text x="24" y="318" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start">happens 195 times, which is 60.4% of the scored hits.</text></svg>